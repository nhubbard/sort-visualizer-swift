[project]
site_url = "https://nhubbard.github.io/sort-visualizer-swift/"
site_name = "Sort Symphony"
site_description = "How Sort Symphony works, and how to make the changes that come up over and over."
# site_author = "Your name"

copyright = "Copyright &copy; 2026 Nicholas Hubbard"

repo_url = "https://github.com/nhubbard/sort-visualizer-swift"
repo_name = "nhubbard/sort-visualizer-swift"
edit_uri = "edit/main/Documentation/docs/"

nav = [
  { "Home" = "index.md" },
  { "Architecture" = [
    { "Overview" = "architecture/overview.md" },
    { "Engine layer" = "architecture/engine.md" },
    { "Content layer" = "architecture/content.md" },
    { "Audio subsystem" = "architecture/audio.md" },
    { "Services" = "architecture/services.md" },
    { "Features & app target" = "architecture/features.md" },
    { "History" = "architecture/history.md" },
  ] },
  { "Guides" = [
    { "Building the project" = "guides/building.md" },
    { "Adding a sorting algorithm" = "guides/adding-an-algorithm.md" },
    { "Adding a shuffle" = "guides/adding-a-shuffle.md" },
    { "Adding a visualizer" = "guides/adding-a-visualizer.md" },
    { "Recalibrating growth models" = "guides/growth-model-calibration.md" },
    { "Managing algorithm content" = "guides/algorithm-content.md" },
  ] },
  { "Reference" = [
    { "Compression formats" = "reference/compression.md" },
    { "Port status" = "reference/port-status.md" },
    { "Dev tools" = "reference/dev-tools.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/nhubbard/sort-visualizer-swift"

[[project.extra.social]]
icon = "fontawesome/brands/app-store"
link = "https://apps.apple.com/us/app/sort-symphony/id6477886990"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
